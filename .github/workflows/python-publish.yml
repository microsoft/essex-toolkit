name: Python-Publish-CI
on:
  release:
    types: [created]
  push:
    branches: [main]

env:
  UV_VERSION: "0.4.17"
  PYTHON_VERSION: "3.11"

jobs:
  publish:
    name: Upload python projects to PyPI
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: ["fnllm"]

    environment:
      name: pypi
      url: https://pypi.org/p/${{ matrix.project }}
    permissions:
        id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '${{ env.PYTHON_VERSION }}'

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}

      - name: Build Distributable
        shell: bash
        working-directory: ./python/${{ matrix.project }}
        run: uv build

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: python/${{ matrix.project }}/dist
          skip-existing: true
          verbose: true
      