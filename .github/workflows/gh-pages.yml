name: gh-pages
on:
  push:
    branches:
      - main
permissions:
  contents: write

env:
  NODE_VERSION: '18.x'
  PYTHON_VERSION: '3.12'
  UV_VERSION: '0.4.20'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
        with:
          persist-credentials: false

      - name: Use Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@f1f314fca9dfce2769ece7d933488f076716723e # v1.4.6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Use up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@e9aba2c848f5ebd159c070c61ea2c4e2b122355e # v2.3.4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "::set-output name=dir::$(yarn config get cacheFolder)"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: yarn-cache # use this to check for `cache-hit` (`steps.yarn-cache.outputs.cache-hit != 'true'`)
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - run: yarn install
        name: yarn install

      - run: yarn bundle:storybook
        name: bundle storybook
      
      
      - name: Install uv
        uses: astral-sh/setup-uv@6dfebec6ddbcd197e02256fbdf54deb334fb7f06 # v2.1.2
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install Dependencies
        shell: bash
        run: uv sync --locked
  
      - name: mkdocs build
        shell: bash
        run: uv run poe build_docs

      - name: Copy Storybook to Python Docs
        run: cp -r javascript/stories/storybook-static site/storybook

      - name: List Docsite Contents
        run: find site

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@8817a56e5bfec6e2b08345c81f4d422db53a2cdc # v4.3.3
        with:
          branch: gh-pages
          folder: site
          clean: true